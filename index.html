<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<title>像素農場小遊戲</title>
<link rel="stylesheet" href="styles/game.css" />
</head>
<body>
<div class="wrap">
  <div class="window">
    <div class="titlebar">
      <span class="tdot r"></span><span class="tdot y"></span><span class="tdot g"></span>
      <span>像素農場</span>
    </div>
    <div class="stage" id="stage">
     <div class="screen" id="screen">
      <canvas id="game" width="720" height="480"></canvas>
      <div class="nightfade" id="nightfade"><span id="nightText">第 2 天</span></div>
      <div class="padbar" id="padbar">
        <div class="dpad">
          <span class="hub"></span>
          <button class="up" data-dir="up" aria-label="上">▲</button>
          <button class="down" data-dir="down" aria-label="下">▼</button>
          <button class="left" data-dir="left" aria-label="左">◀</button>
          <button class="right" data-dir="right" aria-label="右">▶</button>
        </div>
        <div class="padbtns">
          <div class="abrow">
            <button class="abtn b" id="btnB" aria-label="B 取消">B</button>
            <button class="abtn a" id="btnA" aria-label="A 互動">A</button>
          </div>
          <div class="sysrow">
            <button class="pill" id="btnSelect">SELECT 換工具</button>
            <button class="pill" id="btnStart">START 選單</button>
          </div>
        </div>
      </div>
     </div>
    </div>
  </div>

</div>

<section class="startup" id="startup" role="status" aria-live="polite">
  <h1>像素農場</h1>
  <p id="loadMessage">正在準備農場…</p>
  <progress id="loadProgress" max="1" value="0" aria-label="遊戲素材載入進度"></progress>
  <button id="retryLoad" type="button" hidden>重新載入</button>
</section>

<script src="src/namespace.js" defer></script>
<script src="src/config.js" defer></script>
<script src="src/state.js" defer></script>
<script src="src/assets.js" defer></script>
<script src="src/world.js" defer></script>
<script src="src/audio.js" defer></script>
<script src="src/dialogue.js" defer></script>
<script src="src/goals.js" defer></script>
<script src="src/tools.js" defer></script>
<script src="src/animals.js" defer></script>
<script src="src/persistence.js" defer></script>
<script src="src/commerce.js" defer></script>
<script src="src/player.js" defer></script>
<script src="src/day.js" defer></script>
<script src="src/farming.js" defer></script>
<script src="src/menu.js" defer></script>
<script src="src/render/surface.js" defer></script>
<script src="src/render/world.js" defer></script>
<script src="src/render/panels.js" defer></script>
<script src="src/render/renderer.js" defer></script>
<script src="src/input.js" defer></script>
<script src="src/startup.js" defer></script>
<script src="src/main.js" defer></script>
<script src="src/bootstrap.js" defer></script>
</body>
</html>
